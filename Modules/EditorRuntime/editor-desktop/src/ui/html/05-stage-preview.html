<main class="previewarea">
          <div class="stage empty" id="stage" data-drop-zone="preview">
            <div class="ratio">
              <button class="btn" id="previewFullscreen" title="全屏预览（F11 或 Esc 退出）">全屏预览</button
              >
              <button class="btn" data-ratio="9:16">9:16</button
              ><button class="btn" data-ratio="16:9">16:9</button
              ><select class="select" id="resolution" style="width: 132px">
                <option value="1080x1920">1080×1920</option>
                <option value="1440x2560">1440×2560</option>
                <option value="2160x3840">2160×3840</option>
              </select>
            </div>
            <div class="frame" id="frame">
              <div class="center-guide" id="centerGuide"></div>
              <video
                class="videoobject"
                id="video"
                data-type="video"
                data-id="main"
                preload="auto"
              ></video>
              <video
                class="videoobject"
                id="videoAlt"
                data-type="video"
                data-id="main-alt"
                preload="auto"
                style="opacity: 0; pointer-events: none;"
              ></video>
              <canvas class="beauty-preview" id="beautyPreviewCanvas"></canvas>
              <img class="lutpreview" id="lutPreviewFrame" alt="LUT 当前帧预览" />
              <div id="visualLayer"></div>
              <div
                class="visualobject captionobject"
                id="captionPreview"
                data-type="caption"
              ></div>
              <div class="visualobject auxcaptionobject" id="auxCaptionPreview"></div>
              <div
                class="visualobject reviewobject"
                id="reviewPreview"
                data-type="review"
              ></div>
              <div class="selectionbox" id="selectionBox">
                <i class="resizehandle nw" data-handle="nw"></i
                ><i class="resizehandle ne" data-handle="ne"></i
                ><i class="resizehandle sw" data-handle="sw"></i
                ><i class="resizehandle se" data-handle="se"></i
                ><i class="widthhandle w" data-width-handle="w" title="调整文字换行宽度"></i
                ><i class="widthhandle e" data-width-handle="e" title="调整文字换行宽度"></i
                ><i class="rotatehandle" data-rotate-handle title="旋转"></i>
              </div>
              <div id="audioPreviewLayer" hidden></div>
            </div>
            <div class="canvaszoom">
              画布 <span id="canvasZoomLabel">适应</span> ·
              边界外仅供编辑，导出自动裁切
            </div>
          </div>
          <div class="transport">
            <button class="btn iconbtn" id="jumpPrevCut" title="跳转到上一个剪切点（↑）">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>
            <button class="btn iconbtn" id="stepBack" title="后退一帧（←）">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="btn iconbtn primary" id="play" title="播放 / 暂停（空格键）">▶</button>
            <button class="btn iconbtn" id="stepForward" title="前进一帧（→）">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button class="btn iconbtn" id="jumpNextCut" title="跳转到下一个剪切点（↓）">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
            <button class="btn iconbtn" id="loopPlayback" title="循环播放">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>
            <div class="playback-speed-control" id="playbackSpeedControl" title="播放倍速（点击切换或下拉选择，Shift+[ 减速，Shift+] 加速）">
              <button class="speed-pill-btn" id="playbackSpeedBtn" type="button">1.0×</button>
              <select class="speed-select-overlay" id="playbackSpeedSelect" aria-label="播放倍速选择">
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1.0×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="1.75">1.75×</option>
                <option value="2">2.0×</option>
                <option value="2.5">2.5×</option>
                <option value="3">3.0×</option>
              </select>
            </div>
            <span class="timecode" id="timecode">00:00.000 / 00:00.000</span>
          </div>
        </main>
        <div class="panel-resizer" id="rightPanelResizer" data-resize="inspector"></div>
