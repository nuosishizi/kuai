<section class="timeline" id="timeline" data-drop-zone="timeline">
        <div class="timeline-resizer" id="timelineResizer"></div>
        <div class="timelinebar">
          <div class="timelinebar-left">
            <button
              class="btn"
              id="pauseCut"
              title="自动剪停顿：根据气口设置快速剪除多余停顿与底噪"
              style="padding: 4px 8px; font-size: 12px; font-weight: 500;"
            >
              自动剪停顿</button
            ><button
              class="btn iconbtn"
              id="openPauseCutSettings"
              title="剪辑气口设置（调节停顿阈值、抗噪灵敏度与保留缓冲）"
              style="padding: 4px 6px; font-size: 13px;"
            >
              ⚙</button
            ><button class="btn iconbtn" id="addTrack" title="添加文本" style="font-weight: 700; font-size: 13px;">
              T＋</button>

            <div class="trackmenu" id="trackMenu">
              <button data-add-track-kind="video">新增视频轨道</button>
              <button data-add-track-kind="audio">新增音频轨道</button>
              <button data-add-track-kind="image">新增图片轨道</button>
              <button data-add-track-kind="caption">新增字幕轨道</button>
              <button data-add-track-kind="text">新增文字轨道</button>
            </div>
          </div>
          <div class="timelinebar-divider"></div>
          <div class="timelinebar-tools">
            <div class="timeline-center-tools">
              <!-- 达芬奇标准组 1: 核心剪辑工具 -->
              <button class="btn iconbtn active" id="selectTool" title="选择模式（A）：修剪当前片段，前后锁定不动">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7 18 3-7 7-3L3 3z"/><path d="M13 13l6 6"/></svg>
              </button
              ><button class="btn iconbtn" id="trimTool" title="智能修剪（T）：拖边缘波纹修剪；Shift+拖编辑点为 Roll；Option+拖片段内容为 Slip">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><polyline points="8 4 4 8 8 12"/><polyline points="16 12 20 16 16 20"/></svg>
              </button
              ><button class="btn iconbtn" id="bladeTool" title="剃刀切割：点击片段直接切断（B）">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
              </button
              ><button class="btn iconbtn" id="splitClip" title="在播放头切割当前片段（⌘B / Ctrl+B）">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 3"/><polyline points="8 8 4 12 8 16"/><polyline points="16 8 20 12 16 16"/></svg>
              </button
              ><button class="btn iconbtn" id="selectAfterPlayhead" title="全选播放头后全部轨道素材（Alt+A），拖动任一已选片段可整体后移">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="3" x2="7" y2="21"/><polyline points="11 7 15 7 15 17 11 17"/><polyline points="18 7 22 7 22 17 18 17"/></svg>
              </button
              ><button
                class="btn iconbtn"
                id="trimLeft"
                title="波纹剪左：删除播放头左侧到入点（Q）"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="4" x2="5" y2="20"/><polyline points="19 6 11 12 19 18"/></svg>
              </button
              ><button
                class="btn iconbtn"
                id="trimRight"
                title="波纹剪右：删除播放头右侧到出点（W）"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="19" y2="20"/><polyline points="5 6 13 12 5 18"/></svg>
              </button>

              <span class="tool-separator"></span>

              <!-- 达芬奇标准组 2: 辅助对齐与联动开关 -->
              <button class="btn iconbtn active" id="snapToggle" title="时间线吸附（N）">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4v7a8 8 0 0016 0V4"/><line x1="4" y1="8" x2="9" y2="8"/><line x1="15" y1="8" x2="20" y2="8"/></svg>
              </button
              ><button class="btn iconbtn active" id="linkAV" title="音画联动选择：成组音画一起移动和删除">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
              </button>
              <button class="btn iconbtn" id="selectionFollowsPlayhead" title="播放头跟随选择">⇥</button>
              <button class="btn iconbtn" id="mergeClips" title="合并所选相邻切片">⛙</button>

              <span class="tool-separator"></span>

              <!-- 达芬奇标准组 3: 删除、撤销与辅助 -->
              <button
                class="btn iconbtn danger"
                id="deleteClip"
                title="波纹删除：删除所选并前移靠拢（Delete）"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
              </button
              ><button
                class="btn iconbtn danger"
                id="rippleDelete"
                title="普通删除：原地留空（Backspace）"
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
              </button
              ><button class="btn iconbtn" id="undo" title="撤销（⌘Z / Ctrl+Z）">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
              </button
              ><button class="btn iconbtn" id="redo" title="重做（⇧⌘Z / Ctrl+Shift+Z）">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"/></svg>
              </button
              ><button class="btn iconbtn" id="freezeFrame" title="截取当前静帧">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>

            <div class="timeline-right-tools">
              <!-- 达芬奇标准组 4: 右侧视图缩放区 -->
              <button class="btn iconbtn" id="zoomToFitTimeline" title="缩放到适应全部内容（Shift+Z）" style="font-size: 13px; padding: 4px 7px; margin-right: 4px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
              </button
              ><button class="btn iconbtn" id="zoomOutBtn" title="缩小时间线（-）" style="width:24px;height:24px;font-size:14px;padding:0;">−</button
              ><input
                class="zoom"
                id="timelineZoom"
                type="range"
                min="1"
                max="300"
                value="60"
                style="width: 100px; margin: 0 4px;"
              /><button class="btn iconbtn" id="zoomInBtn" title="放大时间线（+）" style="width:24px;height:24px;font-size:14px;padding:0;margin-right:4px;">+</button
              ><button class="btn" id="followPlayhead" title="播放时时间线滚动，播放头停在画面里">跟随滚动</button
              ><span class="small" id="durationLabel" style="font-family:monospace;font-weight:600;margin-left:4px;">00:00</span>
            </div>
          </div>
        </div>
        <div class="timelinebody">
          <div class="tracklabels-col" id="trackLabelCol">
            <div class="ruler-spacer" id="rulerTimecode">00:00</div>
            <div class="tracklabels" id="trackLabels"></div>
          </div>
          <div class="track-resizer" id="trackLabelResizer"></div>
          <div class="timeline-main" id="timelineMain">
            <div class="timeline-overlay" id="timelineOverlay">
              <div class="playhead" id="playhead"></div>
              <div class="snap-guide" id="snapGuide"></div>
              <div class="blade-guide" id="bladeGuide">
                <span class="blade-time" id="bladeTime"></span>
              </div>
              <div class="trim-audio-detail" id="trimAudioDetail">
                <div class="trim-audio-readout"><span id="trimAudioMode">修剪</span><span id="trimAudioValue">00:00:00:00 · +0 帧</span></div>
                <canvas id="trimAudioCanvas"></canvas><i class="trim-audio-cursor"></i>
              </div>
            </div>
            <div class="ruler-bar" id="rulerBar">
              <div class="ruler" id="ruler"></div>
            </div>
            <div class="scroll" id="timelineScroll">
              <div class="timelinecontent" id="timelineContent">
                <div
                  class="trackrow"
                  id="track-review"
                  data-track-key="review"
                ></div>
                <div
                  class="trackrow"
                  id="track-caption"
                  data-track-key="caption"
                ></div>
                <div class="trackrow" id="track-text" data-track-key="text"></div>
                <div
                  class="trackrow"
                  id="track-image"
                  data-track-key="image"
                ></div>
                <div
                  class="trackrow"
                  id="track-video"
                  data-track-key="video"
                ></div>
                <div class="trackrow" id="track-audio" data-track-key="audio">
                  <canvas class="wavecanvas" id="waveform"></canvas>
                </div>
                <div class="timeline-range" id="timelineRange"></div>
                <div class="timeline-marquee" id="timelineMarquee"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
