      @keyframes capSwing {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) rotate(12deg);
        }
        70% {
          transform: translate(-50%, -50%) rotate(-3deg);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }
      @keyframes capType {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0);
        }
      }
      @keyframes wordFlash {
        from {
          filter: brightness(2.4);
          transform: scale(1.25);
        }
        to {
          filter: none;
          transform: none;
          color: var(--active);
        }
      }
      @keyframes wordRotate {
        from {
          transform: rotate(-12deg) scale(0.7);
        }
        to {
          transform: none;
          color: var(--active);
        }
      }
      @keyframes wordSquash {
        0% {
          transform: scaleX(1.4) scaleY(0.65);
        }
        70% {
          transform: scaleX(0.9) scaleY(1.1);
        }
        100% {
          transform: none;
          color: var(--active);
        }
      }
      @keyframes wordWiggle {
        25% {
          transform: rotate(-6deg);
        }
        75% {
          transform: rotate(6deg);
        }
        100% {
          transform: none;
          color: var(--active);
        }
      }
      @keyframes wordWave {
        50% {
          transform: translateY(-0.3em);
        }
        100% {
          transform: none;
          color: var(--active);
        }
      }
      @keyframes qcRise {
        from {
          opacity: 0;
          translate: 0 1em;
        }
        to {
          opacity: 1;
          translate: 0;
        }
      }
      @keyframes qcSlideL {
        from {
          opacity: 0;
          translate: -2em 0;
        }
        to {
          opacity: 1;
          translate: 0;
        }
      }
      @keyframes qcSlideR {
        from {
          opacity: 0;
          translate: 2em 0;
        }
        to {
          opacity: 1;
          translate: 0;
        }
      }
      @keyframes qcZoom {
        from {
          opacity: 0;
          scale: 0.55;
        }
        to {
          opacity: 1;
          scale: 1;
        }
      }
      @keyframes qcFlip {
        from {
          opacity: 0;
          rotate: x 80deg;
        }
        to {
          opacity: 1;
          rotate: x 0deg;
        }
      }
      @keyframes qcShake {
        25% {
          translate: -4px 0;
        }
        75% {
          translate: 4px 0;
        }
        100% {
          translate: 0;
        }
      }
      @keyframes qcStretch {
        from {
          opacity: 0;
          letter-spacing: -0.45em;
          scale: 0.25 1;
        }
        to {
          opacity: 1;
          letter-spacing: normal;
          scale: 1;
        }
      }
      @keyframes qcDrop {
        from {
          opacity: 0;
          translate: 0 -2em;
        }
        to {
          opacity: 1;
          translate: 0;
        }
      }

        }

        }

      :root {

      #selectTool.active, #trimTool.active, #bladeTool.active { color: #f2574f !important; background: transparent !important; border-color: transparent !important; }
      #snapToggle.active, #linkAV.active, #selectionFollowsPlayhead.active { color: #f4f4f5 !important; background: transparent !important; border-color: transparent !important; }
      .tool-separator { height: 27px; background: #3b3c41; margin: 0 7px; }
